name: Shared validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the complete lint gate
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.5.0

      - name: Validate the OpenSpec change strictly
        run: openspec validate "card-sorting-prs-mvp" --strict

      - name: Create CI-only runtime inputs
        run: |
          umask 077
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/labeler-ci.XXXXXX")"
          project="labeler-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'CI_RUNTIME_DIR=%s\n' "$runtime_dir" >> "$GITHUB_ENV"
          printf 'CI_COMPOSE_PROJECT=%s\n' "$project" >> "$GITHUB_ENV"
          printf 'CI_RUNTIME_BASE_URL=https://127.0.0.1:18443\n' >> "$GITHUB_ENV"

          node --input-type=module > "$runtime_dir/database-password" <<'NODE'
          import {randomBytes} from "node:crypto";
          process.stdout.write(randomBytes(32).toString("base64url"));
          NODE
          node --input-type=module > "$runtime_dir/session-current" <<'NODE'
          import {randomBytes} from "node:crypto";
          process.stdout.write(randomBytes(32).toString("base64url"));
          NODE
          node --input-type=module > "$runtime_dir/session-previous" <<'NODE'
          import {randomBytes} from "node:crypto";
          process.stdout.write(randomBytes(32).toString("base64url"));
          NODE
          node --input-type=module > "$runtime_dir/github-token" <<'NODE'
          import {randomBytes} from "node:crypto";
          process.stdout.write(randomBytes(32).toString("base64url"));
          NODE
          : > "$runtime_dir/legacy-retirement.pgpass"
          chmod 0400 "$runtime_dir"/*

          cat > "$runtime_dir/study-config.json" <<'JSON'
          {"studyKey":"pr-card-sorting-local","expectedCardCount":300,"participants":["javier","diego","pablo"]}
          JSON
          node --input-type=module > "$runtime_dir/account-passwords" <<'NODE'
          import {randomBytes} from "node:crypto";
          for (let index = 0; index < 3; index += 1) process.stdout.write(`${randomBytes(32).toString("base64url")}\n`);
          NODE
          npm run credentials:generate -- \
            --study-config "$runtime_dir/study-config.json" \
            --output "$runtime_dir/study-account-manifest.json" \
            --password-fd 3 3<"$runtime_dir/account-passwords"
          chmod 0400 "$runtime_dir/study-account-manifest.json"

          cat > "$runtime_dir/compose.env" <<EOF
          DATABASE_NAME=labeling_ci
          DATABASE_USER=labeling_ci
          DATABASE_PASSWORD_HOST_PATH=$runtime_dir/database-password
          DATABASE_PASSWORD_DATABASE_HOST_PATH=$runtime_dir/database-password
          SESSION_SECRET_CURRENT_HOST_PATH=$runtime_dir/session-current
          SESSION_SECRET_PREVIOUS_HOST_PATH=$runtime_dir/session-previous
          STUDY_ACCOUNT_MANIFEST_HOST_PATH=$runtime_dir/study-account-manifest.json
          PGPASSFILE_HOST_PATH=$runtime_dir/legacy-retirement.pgpass
          GITHUB_TOKEN_HOST_PATH=$runtime_dir/github-token
          PUBLIC_HOSTNAME=127.0.0.1
          APP_ORIGIN=https://127.0.0.1:18443
          GITHUB_ENRICHMENT_ENABLED=false
          EOF

          cat > "$runtime_dir/Caddyfile" <<'CADDY'
          https://127.0.0.1 {
              tls internal
              reverse_proxy labeling-server:3000
          }
          CADDY

          CI_RUNTIME_DIR="$runtime_dir" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python3 <<'PYTHON'
          import os
          from pathlib import Path

          runtime_dir = Path(os.environ["CI_RUNTIME_DIR"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          compose = (workspace / "deployment/docker-compose.yml").read_text()
          replacements = {
              'name: "labeling"\n': "",
              "    container_name: labeling-database\n": "",
              "    container_name: labeling-server\n": "",
              "    container_name: labeling-caddy\n": "",
              "    name: labeling-data\n": "",
              "    name: labeling-network\n": "",
              "      context: ../": f"      context: {workspace}",
              "      - ../plans/merged_after_rework_cards_seed_20260510.csv:": f"      - {workspace}/plans/merged_after_rework_cards_seed_20260510.csv:",
              "      - ./Caddyfile:": f"      - {runtime_dir}/Caddyfile:",
              '      - "80:80"\n      - "443:443"': '      - "127.0.0.1:18443:443"',
          }
          for source, target in replacements.items():
              compose = compose.replace(source, target)
          (runtime_dir / "docker-compose.yml").write_text(compose)
          PYTHON

      - name: Validate the source Compose configuration
        run: docker compose --env-file "$CI_RUNTIME_DIR/compose.env" -f deployment/docker-compose.yml config

      - name: Lint both Dockerfiles
        run: docker run --rm -v "$PWD:/work:ro" -w /work hadolint/hadolint:v2.12.0 hadolint deployment/server/Dockerfile deployment/database/Dockerfile

      - name: Start the isolated ephemeral runtime
        run: docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" up --build --wait --wait-timeout 180

      - name: Seed a CI-only authenticated integration session
        run: |
          IFS='|' read -r account_id study_id reviewer_id < <(
            docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" exec -T labeling-database \
              psql -U labeling_ci -d labeling_ci -At -F '|' -c 'SELECT account.id, account.study_id, account.reviewer_id FROM participant_account account ORDER BY account.normalized_username LIMIT 1'
          )
          mapfile -t card_ids < <(
            docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" exec -T labeling-database \
              psql -U labeling_ci -d labeling_ci -At -c 'SELECT pr_card_id FROM study_card ORDER BY ordinal LIMIT 3'
          )
          test "${#card_ids[@]}" -eq 3
          category_id="$(
            docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" exec -T labeling-database \
              psql -U labeling_ci -d labeling_ci -At -c "INSERT INTO participant_category(participant_id, raw_name, normalized_name) VALUES ($reviewer_id, 'CI category', 'ci category') RETURNING id"
          )"
          session_id="$(node --input-type=module <<'NODE'
          import {randomBytes} from "node:crypto";
          process.stdout.write(randomBytes(32).toString("base64url"));
          NODE
          )"
          csrf_token="$(node --input-type=module <<'NODE'
          import {randomBytes} from "node:crypto";
          process.stdout.write(randomBytes(32).toString("base64url"));
          NODE
          )"
          session_cookie="$(SESSION_ID="$session_id" SESSION_SECRET_FILE="$CI_RUNTIME_DIR/session-current" node --input-type=module <<'NODE'
          import {createHmac} from "node:crypto";
          import {readFileSync} from "node:fs";
          const secret = Buffer.from(readFileSync(process.env.SESSION_SECRET_FILE, "utf8").trim(), "base64url");
          const tag = createHmac("sha256", secret).update(process.env.SESSION_ID, "ascii").digest("base64url");
          process.stdout.write(`__Host-session=${process.env.SESSION_ID}.${tag}`);
          NODE
          )"
          cat > "$CI_RUNTIME_DIR/seed-session.sql" <<SQL
          INSERT INTO app_session(session_id, account_id, study_id, reviewer_id, credential_version, csrf_token, expires_at, absolute_expires_at)
          VALUES ('$session_id', '$account_id', '$study_id', $reviewer_id, 1, '$csrf_token', NOW() + INTERVAL '8 hours', NOW() + INTERVAL '24 hours');
          SQL
          docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" exec -T labeling-database \
            psql -v ON_ERROR_STOP=1 -U labeling_ci -d labeling_ci < "$CI_RUNTIME_DIR/seed-session.sql"
          {
            printf 'STUDY_HTTP_BASE_URL=%s\n' "$CI_RUNTIME_BASE_URL"
            printf 'STUDY_HTTP_SESSION_COOKIE=%s\n' "$session_cookie"
            printf 'STUDY_HTTP_CSRF_TOKEN=%s\n' "$csrf_token"
            printf 'STUDY_HTTP_REPLAY_CARD_ID=%s\n' "${card_ids[0]}"
            printf 'STUDY_HTTP_NAVIGATION_CARD_ID=%s\n' "${card_ids[1]}"
            printf 'STUDY_HTTP_CONCURRENT_CARD_ID=%s\n' "${card_ids[2]}"
            printf 'STUDY_HTTP_CATEGORY_ID=%s\n' "$category_id"
          } > "$CI_RUNTIME_DIR/integration.env"
          chmod 0400 "$CI_RUNTIME_DIR/integration.env"

      - name: Run the integration gate against the ephemeral runtime
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          set -a
          . "$CI_RUNTIME_DIR/integration.env"
          set +a
          npm run test:integration

      - name: Run the E2E gate against the ephemeral runtime
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          STUDY_E2E_BASE_URL: ${{ env.CI_RUNTIME_BASE_URL }}
        run: npm run test:e2e

      - name: Collect runtime diagnostics after a failure
        if: failure()
        run: |
          docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" ps
          docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" logs --no-color

      - name: Remove the ephemeral runtime
        if: always() && env.CI_RUNTIME_DIR != ''
        run: |
          docker compose --project-name "$CI_COMPOSE_PROJECT" --env-file "$CI_RUNTIME_DIR/compose.env" -f "$CI_RUNTIME_DIR/docker-compose.yml" down --volumes --remove-orphans
          rm -rf "$CI_RUNTIME_DIR"
