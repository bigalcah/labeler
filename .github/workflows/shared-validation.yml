name: Shared validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build a local server image for Docker-backed tests
        run: |
          image="labeler-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:test"
          docker build --file deployment/server/Dockerfile --tag "$image" .
          printf 'LABELER_READINESS_TEST_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Run the complete lint gate
        run: npm run lint

      - name: Run the complete unit selection sequentially
        run: npm run test:unit

      - name: Install pinned OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.9.0

      - name: Verify the OpenSpec CLI version
        run: test "$(openspec --version)" = "1.9.0"

      - name: Validate every active OpenSpec artifact strictly
        run: openspec validate --all --strict --no-interactive --json

      - name: Lint both Dockerfiles
        run: docker run --rm -v "$PWD:/work:ro" -w /work hadolint/hadolint:v2.12.0 hadolint deployment/server/Dockerfile deployment/database/Dockerfile

      - name: Run isolated 369/30 release, integration, security, export, and preservation gates
        env:
          HARNESS_EVIDENCE_DIR: ${{ runner.temp }}/labeler-validation-evidence
        run: |
          umask 077
          mkdir -m 700 "$HARNESS_EVIDENCE_DIR"
          npm run test:deployment
